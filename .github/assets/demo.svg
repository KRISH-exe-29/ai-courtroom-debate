<text x="480" y="25" text-anchor="middle" fill="#6b7280" style="font-size:13px">courtroom — real trial replay</text>
<text class="l0" x="32" y="78" xml:space="preserve"><tspan fill="#22c55e">$ </tspan><tspan fill="#e5e7eb">npm run trial -- "Should I quit my job to build a startup?"</tspan></text>
<text class="l1" x="32" y="102" xml:space="preserve"><tspan fill="#ffffff" font-weight="700">CASE: </tspan><tspan fill="#e5e7eb">Should I quit my job to build a startup?</tspan></text>
<text class="l2" x="32" y="126" xml:space="preserve"><tspan fill="#60a5fa" font-weight="700">AEGIS</tspan><tspan fill="#9ca3af"> opens.</tspan></text>
<text class="l4" x="32" y="174" xml:space="preserve"><tspan fill="#60a5fa" font-weight="700">AEGIS</tspan><tspan fill="#6b7280"> [0] opening</tspan></text>
<text class="l5" x="32" y="198" xml:space="preserve"><tspan fill="#d1d5db">Quitting is defensible here: you have a working prototype and eight</tspan></text>
<text class="l6" x="32" y="222" xml:space="preserve"><tspan fill="#d1d5db">months of runway, which buys real time to learn whether people will pay.</tspan></text>
<text class="l8" x="32" y="270" xml:space="preserve"><tspan fill="#f87171" font-weight="700">NEMESIS</tspan><tspan fill="#6b7280"> [1] opening</tspan></text>
<text class="l9" x="32" y="294" xml:space="preserve"><tspan fill="#d1d5db">A working prototype measures your ability to build, not anyone's</tspan></text>
<text class="l10" x="32" y="318" xml:space="preserve"><tspan fill="#d1d5db">willingness to pay. Why quit before testing demand?</tspan></text>
<text class="l12" x="32" y="366" xml:space="preserve"><tspan fill="#60a5fa" font-weight="700">AEGIS</tspan><tspan fill="#6b7280"> [4] rebuttal</tspan></text>
<text class="l13" x="32" y="390" xml:space="preserve"><tspan fill="#d1d5db">...I never claimed quitting today was right.</tspan></text>
<text class="l14" x="32" y="414" xml:space="preserve"><tspan fill="#f472b6" font-weight="700">OBJECTION! </tspan><tspan fill="#f9a8d4">MISCHARACTERIZATION</tspan></text>
<text class="l15" x="32" y="438" xml:space="preserve"><tspan fill="#f5c451" font-weight="700">ARBITER </tspan><tspan fill="#e5e7eb" font-weight="700">OVERRULED</tspan></text>
<text class="l16" x="32" y="462" xml:space="preserve"><tspan fill="#f5c451" font-weight="700">ARBITER </tspan><tspan fill="#f87171" font-weight="700">−3 CONTRADICTION </tspan><tspan fill="#9ca3af">«I never claimed quitting today was right.»</tspan></text>
<text class="l17" x="32" y="486" xml:space="preserve"><tspan fill="#60a5fa" font-weight="700">  AEGIS </tspan><tspan fill="#3b82f6">███████</tspan><tspan fill="#374151">░░░</tspan><tspan fill="#93c5fd"> 7 </tspan><tspan fill="#4b5563">│ </tspan><tspan fill="#f87171" font-weight="700">NEMESIS </tspan><tspan fill="#ef4444">██████████</tspan><tspan fill="#fca5a5"> 10</tspan></text>
<text class="l19" x="32" y="534" xml:space="preserve"><tspan fill="#f5c451" font-weight="700">ARBITER VERDICT: </tspan><tspan fill="#fde68a" font-weight="700">CONDITIONAL</tspan><tspan fill="#9ca3af"> (confidence 80)</tspan></text>
<text class="l20" x="32" y="558" xml:space="preserve"><tspan fill="#d1d5db">  - Keep the job while running a three-month paid-pilot test</tspan></text>
<text class="l21" x="32" y="582" xml:space="preserve"><tspan fill="#d1d5db">  - Resign only after signed, paid pilots exist</tspan></text>
