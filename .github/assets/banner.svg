<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Courtroom AI: two AI lawyers argue your idea, a blind AI judge scores every move">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a14"/>
      <stop offset="1" stop-color="#11162a"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#f5c451" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f5c451" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ef4444" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#d99a1e"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#spot)"/>

  <g fill="#ffffff" fill-opacity="0.035">
    <rect x="28" y="30" width="30" height="580" rx="4"/>
    <rect x="80" y="30" width="30" height="580" rx="4"/>
    <rect x="1170" y="30" width="30" height="580" rx="4"/>
    <rect x="1222" y="30" width="30" height="580" rx="4"/>
  </g>

  <!-- ARBITER: scales of justice -->
  <g transform="translate(640 112)">
    <circle r="66" fill="#f5c451" fill-opacity="0.07" stroke="#f5c451" stroke-opacity="0.35"/>
    <g stroke="#f5c451" stroke-width="4.5" stroke-linecap="round" fill="none">
      <line x1="0" y1="-40" x2="0" y2="34"/>
      <line x1="-40" y1="-26" x2="40" y2="-26"/>
      <line x1="-40" y1="-26" x2="-52" y2="6"/>
      <line x1="-40" y1="-26" x2="-28" y2="6"/>
      <line x1="40" y1="-26" x2="28" y2="6"/>
      <line x1="40" y1="-26" x2="52" y2="6"/>
      <line x1="-18" y1="34" x2="18" y2="34"/>
    </g>
    <path d="M-56 6 Q-40 24 -24 6 Z M24 6 Q40 24 56 6 Z" fill="url(#gold)"/>
    <circle cy="-44" r="5.5" fill="#ffe08a"/>
  </g>

  <text x="640" y="252" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="10" fill="#ffffff">COURTROOM <tspan fill="#f5c451">AI</tspan></text>
  <text x="640" y="298" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="25" fill="#c7cce0">Two AI lawyers argue your idea. A blind AI judge scores every move.</text>

  <!-- AEGIS -->
  <g transform="translate(250 418)">
    <circle r="112" fill="url(#blueGlow)"/>
    <path d="M0 -56 L46 -38 V2 C46 32 24 50 0 62 C-24 50 -46 32 -46 2 V-38 Z" fill="#0f2350" stroke="#60a5fa" stroke-width="4"/>
    <path d="M-18 2 L-4 16 L22 -12" fill="none" stroke="#93c5fd" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text y="102" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="5" fill="#60a5fa">AEGIS</text>
    <text y="128" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" letter-spacing="3" fill="#8ea3c9">DEFENCE</text>
  </g>

  <!-- NEMESIS -->
  <g transform="translate(1030 418)">
    <circle r="112" fill="url(#redGlow)"/>
    <path d="M0 -58 L52 30 H-52 Z" fill="#4a0f16" stroke="#f87171" stroke-width="4" stroke-linejoin="round"/>
    <line x1="0" y1="-20" x2="0" y2="4" stroke="#fca5a5" stroke-width="7" stroke-linecap="round"/>
    <circle cy="18" r="4.5" fill="#fca5a5"/>
    <text y="102" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="5" fill="#f87171">NEMESIS</text>
    <text y="128" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" letter-spacing="3" fill="#c99a9a">PROSECUTION</text>
  </g>

  <!-- HP bars -->
  <g transform="translate(140 576)">
    <g fill="#3b82f6">
      <rect x="0" width="16" height="12" rx="3"/><rect x="20" width="16" height="12" rx="3"/><rect x="40" width="16" height="12" rx="3"/><rect x="60" width="16" height="12" rx="3"/><rect x="80" width="16" height="12" rx="3"/><rect x="100" width="16" height="12" rx="3"/><rect x="120" width="16" height="12" rx="3"/>
    </g>
    <g fill="#ffffff" fill-opacity="0.12"><rect x="140" width="16" height="12" rx="3"/><rect x="160" width="16" height="12" rx="3"/><rect x="180" width="16" height="12" rx="3"/></g>
    <text x="206" y="12" font-family="Consolas, Menlo, monospace" font-size="17" fill="#93c5fd">7 HP</text>
  </g>
  <g transform="translate(920 576)">
    <g fill="#ef4444">
      <rect x="0" width="16" height="12" rx="3"/><rect x="20" width="16" height="12" rx="3"/><rect x="40" width="16" height="12" rx="3"/><rect x="60" width="16" height="12" rx="3"/><rect x="80" width="16" height="12" rx="3"/><rect x="100" width="16" height="12" rx="3"/><rect x="120" width="16" height="12" rx="3"/><rect x="140" width="16" height="12" rx="3"/><rect x="160" width="16" height="12" rx="3"/>
    </g>
    <g fill="#ffffff" fill-opacity="0.12"><rect x="180" width="16" height="12" rx="3"/></g>
    <text x="206" y="12" font-family="Consolas, Menlo, monospace" font-size="17" fill="#fca5a5">9 HP</text>
  </g>

  <!-- what happens in a trial -->
  <g font-family="Consolas, Menlo, monospace" font-size="18" text-anchor="middle">
    <rect x="470" y="364" width="340" height="44" rx="22" fill="#ec4899" fill-opacity="0.10" stroke="#f472b6" stroke-opacity="0.45"/>
    <text x="640" y="392" fill="#f9a8d4" font-weight="700">OBJECTION!  MISCHARACTERIZATION</text>
    <rect x="470" y="424" width="340" height="44" rx="22" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="640" y="452" fill="#e5e7eb"><tspan fill="#f5c451">ARBITER</tspan>  −3 CONTRADICTION</text>
    <rect x="470" y="484" width="340" height="44" rx="22" fill="#f5c451" fill-opacity="0.10" stroke="#f5c451" stroke-opacity="0.45"/>
    <text x="640" y="512" fill="#fde68a" font-weight="700">VERDICT: CONDITIONAL · 80%</text>
  </g>
</svg>
