  <g class="p3"><rect x="470" y="456" width="340" height="44" rx="22" fill="#fff" fill-opacity="0.06" stroke="#fff" stroke-opacity="0.15"/><text x="640" y="484" fill="#e5e7eb"><tspan fill="#f5c451">ARBITER</tspan>  −1 REPETITION</text></g>
  <g class="p4"><rect x="470" y="512" width="340" height="44" rx="22" fill="#f5c451" fill-opacity="0.14" stroke="#f5c451" stroke-opacity="0.6"/><text x="640" y="540" fill="#fde68a" font-weight="700">VERDICT: CONDITIONAL · 80%</text></g>
