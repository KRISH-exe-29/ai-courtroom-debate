  <path d="M-56 6 Q-40 24 -24 6 Z M24 6 Q40 24 56 6 Z" fill="url(#gold)"/></g><circle cy="-44" r="5.5" fill="#ffe08a"/></g>
<text x="640" y="252" text-anchor="middle" font-family="Segoe UI, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="10" fill="url(#title)">COURTROOM <tspan fill="#f5c451">AI</tspan></text>
<text x="640" y="298" text-anchor="middle" font-family="Segoe UI, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="25" fill="#c7cce0">Two AI lawyers argue your idea. A blind AI judge scores every move.</text>
