<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Courtroom AI: AEGIS and NEMESIS argue, ARBITER penalises and rules">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070a14"/><stop offset="1" stop-color="#12172c"/></linearGradient>
  <radialGradient id="spot" cx="0.5" cy="0.15" r="0.65"><stop offset="0" stop-color="#f5c451" stop-opacity="0.20"/><stop offset="1" stop-color="#f5c451" stop-opacity="0"/></radialGradient>
  <radialGradient id="blueGlow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#3b82f6" stop-opacity="0.5"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
  <radialGradient id="redGlow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ef4444" stop-opacity="0.5"/><stop offset="1" stop-color="#ef4444" stop-opacity="0"/></radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#d99a1e"/></linearGradient>
  <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#93c5fd"/><stop offset="0.5" stop-color="#ffffff"/><stop offset="1" stop-color="#fca5a5"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity="0.04"/></pattern></defs>
<style>
  .beam{transform-origin:640px 86px;animation:sway 6s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
  .pulseB{animation:pulse 3s ease-in-out infinite}.pulseR{animation:pulse 3s ease-in-out 1.5s infinite}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  .drain{animation:drain 12s infinite}
  @keyframes drain{0%,40%{fill:#3b82f6;fill-opacity:1}44%,94%{fill:#ffffff;fill-opacity:.12}100%{fill:#3b82f6;fill-opacity:1}}
  .drain2{animation:drainR 12s infinite}
  @keyframes drainR{0%,62%{fill:#ef4444;fill-opacity:1}66%,94%{fill:#ffffff;fill-opacity:.12}100%{fill:#ef4444;fill-opacity:1}}
  .hp7{animation:hp7 12s infinite}@keyframes hp7{0%,40%{opacity:0}44%,94%{opacity:1}100%{opacity:0}}
  .hp10{animation:hp10 12s infinite}@keyframes hp10{0%,40%{opacity:1}44%,94%{opacity:0}100%{opacity:1}}
  .hp9{animation:hp9 12s infinite}@keyframes hp9{0%,62%{opacity:0}66%,94%{opacity:1}100%{opacity:0}}
  .hpn10{animation:hpn10 12s infinite}@keyframes hpn10{0%,62%{opacity:1}66%,94%{opacity:0}100%{opacity:1}}
  .dmg{animation:dmg 12s infinite}@keyframes dmg{0%,40%{opacity:0;transform:translateY(0)}43%{opacity:1}52%{opacity:0;transform:translateY(-40px)}100%{opacity:0}}
  .dmg2{animation:dmg2 12s infinite}@keyframes dmg2{0%,62%{opacity:0;transform:translateY(0)}65%{opacity:1}74%{opacity:0;transform:translateY(-40px)}100%{opacity:0}}
  .p1{animation:p1 12s infinite}@keyframes p1{0%,12.00%{opacity:0;transform:translateY(6px)}14.00%,94.00%{opacity:1;transform:none}100%{opacity:0}}
  .p2{animation:p2 12s infinite}@keyframes p2{0%,38.00%{opacity:0;transform:translateY(6px)}40.00%,94.00%{opacity:1;transform:none}100%{opacity:0}}
  .p3{animation:p3 12s infinite}@keyframes p3{0%,60.00%{opacity:0;transform:translateY(6px)}62.00%,94.00%{opacity:1;transform:none}100%{opacity:0}}
  .p4{animation:p4 12s infinite}@keyframes p4{0%,78.00%{opacity:0;transform:translateY(6px)}80.00%,94.00%{opacity:1;transform:none}100%{opacity:0}}
  .flash{animation:flash 12s infinite}@keyframes flash{0%,11%{opacity:0}12%{opacity:.35}16%,100%{opacity:0}}
</style>
<rect width="1280" height="640" rx="24" fill="url(#bg)"/><rect width="1280" height="640" rx="24" fill="url(#grid)"/><rect width="1280" height="640" rx="24" fill="url(#spot)"/>
