  <text y="128" text-anchor="middle" font-family="Segoe UI, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="15" letter-spacing="3" fill="#8ea3c9">DEFENCE</text>
  <text class="dmg" x="70" y="-40" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="34" font-weight="800" fill="#f87171">−3</text></g>
<g transform="translate(1030 418)"><circle class="pulseR" r="112" fill="url(#redGlow)"/><path d="M0 -58 L52 30 H-52 Z" fill="#4a0f16" stroke="#f87171" stroke-width="4" stroke-linejoin="round"/><line x1="0" y1="-20" x2="0" y2="4" stroke="#fca5a5" stroke-width="7" stroke-linecap="round"/><circle cy="18" r="4.5" fill="#fca5a5"/>
  <text y="102" text-anchor="middle" font-family="Segoe UI, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="5" fill="#f87171">NEMESIS</text>
  <text y="128" text-anchor="middle" font-family="Segoe UI, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="15" letter-spacing="3" fill="#c99a9a">PROSECUTION</text>
  <text class="dmg2" x="-110" y="-40" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="34" font-weight="800" fill="#f87171">−1</text></g>
<g transform="translate(140 576)"><rect class="" x="0" width="16" height="12" rx="3" fill="#3b82f6"/><rect class="" x="20" width="16" height="12" rx="3" fill="#3b82f6"/><rect class="" x="40" width="16" height="12" rx="3" fill="#3b82f6"/><rect class="" x="60" width="16" height="12" rx="3" fill="#3b82f6"/><rect class="" x="80" width="16" height="12" rx="3" fill="#3b82f6"/><rect class="" x="100" width="16" height="12" rx="3" fill="#3b82f6"/><rect class="" x="120" width="16" height="12" rx="3" fill="#3b82f6"/><rect class="drain" x="140" width="16" height="12" rx="3" fill="#3b82f6"/><rect class="drain" x="160" width="16" height="12" rx="3" fill="#3b82f6"/><rect class="drain" x="180" width="16" height="12" rx="3" fill="#3b82f6"/>
  <text class="hp10" x="206" y="12" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="17" fill="#93c5fd">10 HP</text><text class="hp7" x="206" y="12" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="17" fill="#93c5fd">7 HP</text></g>
<g transform="translate(920 576)"><rect class="" x="0" width="16" height="12" rx="3" fill="#ef4444"/><rect class="" x="20" width="16" height="12" rx="3" fill="#ef4444"/><rect class="" x="40" width="16" height="12" rx="3" fill="#ef4444"/><rect class="" x="60" width="16" height="12" rx="3" fill="#ef4444"/><rect class="" x="80" width="16" height="12" rx="3" fill="#ef4444"/><rect class="" x="100" width="16" height="12" rx="3" fill="#ef4444"/><rect class="" x="120" width="16" height="12" rx="3" fill="#ef4444"/><rect class="" x="140" width="16" height="12" rx="3" fill="#ef4444"/><rect class="" x="160" width="16" height="12" rx="3" fill="#ef4444"/><rect class="drain2" x="180" width="16" height="12" rx="3" fill="#ef4444"/>
  <text class="hpn10" x="206" y="12" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="17" fill="#fca5a5">10 HP</text><text class="hp9" x="206" y="12" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="17" fill="#fca5a5">9 HP</text></g>
<g font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="18" text-anchor="middle">
  <g class="p1"><rect x="470" y="344" width="340" height="44" rx="22" fill="#ec4899" fill-opacity="0.14" stroke="#f472b6" stroke-opacity="0.6"/><text x="640" y="372" fill="#f9a8d4" font-weight="700">OBJECTION!  MISCHARACTERIZATION</text></g>
